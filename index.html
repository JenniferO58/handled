<meta name="theme-color" content="#0E1C18" media="(prefers-color-scheme: dark)">

<meta property="og:description" content="Transport, flowers, cakes and luggage coordinated around your plans, with one WhatsApp contact until everyone's home.">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Handled","description":"Event, celebration and travel logistics concierge coordinating third-party suppliers.","areaServed":"London and surrounding areas"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Figtree:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECE8DF; --surface:#F8F6F1; --surface-2:#E1E4DA; --ink:#13322A; --ink-2:#4B5B54; --ink-3:#56625C;
  --line:#D2CEC2; --line-2:#C2BDAE;
  --btn-bg:#13322A; --btn-ink:#F8F6F1; --band:#13322A; --band-ink:#EFEBE1; --band-2:#1D4438;
  --brass:#A9823A; --brass-soft:#EEDFBE;
  --ok:#2A7352; --ok-bg:#D8EADF; --warn:#7E500C; --warn-bg:#F3E3C1; --bad:#A1422F; --bad-bg:#F3D9D2;
  --info:#2D5F63; --info-bg:#D5E5E2; --neutral:#55625C; --neutral-bg:#E3E1D9;
  --wa-bg:#E7E2D6; --wa-out:#DDEBCF; --wa-in:#FFFFFF; --wa-head:#1F4A3E;
  --r-s:6px; --r-m:10px; --r-l:20px;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 0 rgba(19,50,42,.04),0 10px 30px -18px rgba(19,50,42,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C18; --surface:#15261F; --surface-2:#1B3029; --ink:#ECE8DF; --ink-2:#B3BDB6; --ink-3:#8E9A93;
    --line:#2A4037; --line-2:#36503F; --btn-bg:#D8BD7E; --btn-ink:#0E1C18; --band:#0A1612; --band-ink:#ECE8DF; --band-2:#15261F;
    --brass:#D0B070; --brass-soft:#3A3322;
    --ok:#7FCBA2; --ok-bg:#1C3A2C; --warn:#E3B566; --warn-bg:#3A2F18; --bad:#EE9B88; --bad-bg:#3E2019;
    --info:#93C4C0; --info-bg:#183433; --neutral:#B3BDB6; --neutral-bg:#24352E;
    --wa-bg:#0B1411; --wa-out:#274536; --wa-in:#1B2A24; --wa-head:#163F33;
    --shadow:0 10px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C18; --surface:#15261F; --surface-2:#1B3029; --ink:#ECE8DF; --ink-2:#B3BDB6; --ink-3:#8E9A93;
  --line:#2A4037; --line-2:#36503F; --btn-bg:#D8BD7E; --btn-ink:#0E1C18; --band:#0A1612; --band-ink:#ECE8DF; --band-2:#15261F;
  --brass:#D0B070; --brass-soft:#3A3322;
  --ok:#7FCBA2; --ok-bg:#1C3A2C; --warn:#E3B566; --warn-bg:#3A2F18; --bad:#EE9B88; --bad-bg:#3E2019;
  --info:#93C4C0; --info-bg:#183433; --neutral:#B3BDB6; --neutral-bg:#24352E;
  --wa-bg:#0B1411; --wa-out:#274536; --wa-in:#1B2A24; --wa-head:#163F33;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:400}
p{margin:0 0 .9em}
h1{font-family:var(--serif);font-size:clamp(2.6rem,6.4vw,5.1rem);line-height:1.0;letter-spacing:-.022em}
h2{font-family:var(--serif);font-size:clamp(1.9rem,3.8vw,2.9rem);line-height:1.08;letter-spacing:-.015em}
h3{font-size:1.18rem;font-weight:600;line-height:1.3;letter-spacing:-.005em}
h4{font-size:1rem;font-weight:600}
.lede{font-size:clamp(1.08rem,1.6vw,1.25rem);color:var(--ink-2);max-width:42ch;line-height:1.5}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.container{width:min(1180px,100% - 40px);margin-inline:auto}
.narrow{width:min(780px,100% - 40px);margin-inline:auto}
.section{padding:96px 0}
.alt{background:var(--surface)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:18px}.mt2{margin-top:32px}
@media (max-width:720px){.hide-sm{display:none!important}.section{padding:64px 0}}

/* Prototype bar */
.protobar{background:var(--band);color:var(--band-ink);font-size:.82rem}
.protobar .container{display:flex;gap:14px;align-items:center;justify-content:space-between;min-height:40px;flex-wrap:wrap;padding:6px 0}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.07);padding:3px;border-radius:999px;overflow-x:auto;max-width:100%}
.seg a{padding:4px 12px;border-radius:999px;text-decoration:none;white-space:nowrap;opacity:.8}
.seg a[aria-current="true"]{background:var(--band-ink);color:var(--band);opacity:1;font-weight:600}

/* Header */
.site-head{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.site-head .container{display:flex;align-items:center;gap:28px;min-height:70px;position:relative}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:1.6rem;letter-spacing:-.02em}
.logo svg{flex:none}
.nav{display:flex;gap:22px;align-items:center;margin-left:auto}
.nav a{text-decoration:none;font-size:.95rem;color:var(--ink-2)}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink)}
.nav .today-link{display:inline-flex;gap:7px;align-items:center;color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brass);display:inline-block;flex:none}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;cursor:pointer}
@media (max-width:980px){
  .menu-btn{display:inline-flex}
  .nav{display:none;position:absolute;left:-20px;right:-20px;top:100%;flex-direction:column;align-items:stretch;gap:0;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 20px 18px}
  .nav a{padding:13px 0;border-bottom:1px solid var(--line);font-size:1.05rem;color:var(--ink)}
  .nav .btn{margin-top:14px;justify-content:center;border-bottom:0;color:var(--btn-ink)}
  .site-head.open .nav{display:flex}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;border:1px solid transparent;text-decoration:none;font-weight:600;font-size:.98rem;cursor:pointer;line-height:1.1;transition:transform .15s ease,background .15s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--btn-bg);color:var(--btn-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--btn-bg) 86%,var(--brass))}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{background:var(--surface)}
.btn-light{background:var(--band-ink);color:var(--band)}
.btn-wa{background:#1F4A3E;color:#fff}
.btn-sm{padding:9px 15px;font-size:.88rem}
.btn-xs{padding:5px 11px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--brass);text-decoration-thickness:2px;cursor:pointer;font-weight:600}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.brass{background:var(--brass-soft);color:var(--ink)} .pill.brass::before{background:var(--brass)}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.tag.internal{background:var(--bad-bg);color:var(--bad)}

/* Hero */
.hero{padding:72px 0 92px;position:relative;overflow:hidden;isolation:isolate}
.hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:64px;align-items:center}
.hero h1{max-width:11ch}
.hero .lede{margin:26px 0 34px}
.hero-note{margin-top:28px;font-size:.9rem;color:var(--ink-2);display:flex;gap:10px;align-items:baseline;max-width:48ch}
.hero-map{position:absolute;inset:0;pointer-events:none;z-index:-1;color:var(--line-2)}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:44px}.hero{padding:44px 0 64px}}

/* Route motif */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow)}
.hero-card{padding:26px 26px 22px}
.hc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.hc-title{font-family:var(--serif);font-size:1.5rem;line-height:1.15;margin:2px 0 0}
.route{list-style:none;margin:0;padding:0;position:relative}
.route>li{position:relative;display:grid;grid-template-columns:54px 22px 1fr;gap:10px;padding-bottom:20px}
.route>li:last-child{padding-bottom:0}
.route .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:.92rem;padding-top:1px}
.route .node{position:relative;display:flex;justify-content:center}
.route .node::before{content:"";width:13px;height:13px;border-radius:50%;border:3px solid var(--brass);background:var(--surface);margin-top:5px;z-index:1;box-sizing:border-box;transition:background .4s,border-color .4s,box-shadow .4s}
.route>li:not(:last-child) .node::after{content:"";position:absolute;top:12px;bottom:-26px;left:50%;width:3px;margin-left:-1.5px;background:var(--brass);opacity:.3;transition:opacity .4s}
.route>li.done .node::before{background:var(--brass)}
.route>li.done:not(:last-child) .node::after{opacity:1}
.route>li.now .node::before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 22%,transparent)}
.route b{display:block;font-weight:600;font-size:.98rem}
.route .s{display:block;color:var(--ink-2);font-size:.9rem}
.hc-foot{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line-2);display:flex;flex-wrap:wrap;gap:8px}
.hero-bubble{margin-top:16px;transition:opacity .45s ease,transform .45s ease}
.hero-bubble.pre{opacity:0;transform:translateY(6px)}

/* WhatsApp */
.wa{background:var(--wa-bg);border-radius:var(--r-l);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.wa-head{background:var(--wa-head);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
.wa-av{width:38px;height:38px;border-radius:50%;background:#E9DDBF;color:#13322A;display:grid;place-items:center;font-family:var(--serif);font-size:1.15rem;flex:none}
.wa-head b{display:block;font-size:.98rem} .wa-head span{font-size:.78rem;opacity:.8}
.wa-body{padding:16px 14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:260px;max-height:480px;background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1px);background-size:14px 14px}
.bubble{max-width:86%;padding:8px 11px 6px;border-radius:10px;font-size:.92rem;line-height:1.42;white-space:pre-line;box-shadow:0 1px 0 rgba(0,0,0,.08);color:var(--ink)}
.bubble.in{background:var(--wa-in);align-self:flex-start;border-top-left-radius:2px}
.bubble.out{background:var(--wa-out);align-self:flex-end;border-top-right-radius:2px}
.bubble .meta{display:block;text-align:right;font-size:.68rem;color:var(--ink-2);margin-top:3px}
.bubble.sys{align-self:center;background:var(--brass-soft);font-size:.78rem;box-shadow:none;text-align:center;padding:5px 10px}
.wa-input{display:flex;gap:8px;padding:10px;background:color-mix(in srgb,var(--wa-bg) 60%,var(--surface))}
.wa-input input{flex:1;min-width:0;border-radius:999px;border:1px solid var(--line);padding:10px 16px;background:var(--surface)}
.wa-send{width:44px;height:44px;border-radius:50%;border:0;background:var(--wa-head);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}

/* Service lines */
.services{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line-2)}
.svc{padding:36px 36px 34px 0;border-bottom:1px solid var(--line-2);display:grid;grid-template-rows:auto auto 1fr auto;gap:14px}
.svc:nth-child(odd){border-right:1px solid var(--line-2)}
.svc:nth-child(even){padding-left:36px;padding-right:0}
.svc h3{font-family:var(--serif);font-weight:400;font-size:2.2rem;letter-spacing:-.015em}
.svc p{color:var(--ink-2);margin:0;max-width:40ch}
.svc ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 8px;align-content:start}
.svc li{font-size:.9rem;padding:4px 11px;border:1px solid var(--line-2);border-radius:999px;color:var(--ink-2)}
@media (max-width:760px){.services{grid-template-columns:1fr}.svc,.svc:nth-child(even){padding:28px 0;border-right:0}}

/* Split layouts */
.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.split.wide-l{grid-template-columns:1.1fr .9fr}
@media (max-width:900px){.split,.split.wide-l{grid-template-columns:1fr;gap:36px}}
.head-block{max-width:660px;margin-bottom:44px}
.head-block p{margin-top:16px}
.bigquote{font-family:var(--serif);font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.25;max-width:26ch;margin:0}

/* Receipt */
.receipt{padding:28px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line)}
.receipt h3{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin-bottom:4px}
.rline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0 3px;font-variant-numeric:tabular-nums}
.rline.fee{padding:2px 0 11px 18px;color:var(--ink-2);font-size:.9rem;border-bottom:1px solid var(--line)}
.rline.total{border-top:2px solid var(--ink);margin-top:8px;padding-top:14px;font-weight:700;font-size:1.15rem}
.rline.split2{font-size:.9rem;color:var(--ink-2);padding:4px 0}
.illus{display:flex;gap:8px;align-items:flex-start;margin-top:16px;font-size:.82rem;color:var(--ink-2);background:var(--surface-2);padding:10px 12px;border-radius:var(--r-m)}

/* Standards */
.checks{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.checks li{padding:13px 0 13px 32px;border-bottom:1px solid var(--line);position:relative}
.checks li::before{content:"";position:absolute;left:0;top:15px;width:18px;height:18px;border-radius:50%;background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)}
.checks li::after{content:"";position:absolute;left:6px;top:18px;width:6px;height:9px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.checks.one{grid-template-columns:1fr}
@media (max-width:640px){.checks{grid-template-columns:1fr}}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tier{padding:22px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.tier h4{font-family:var(--serif);font-weight:400;font-size:1.45rem;margin:12px 0 6px}
.tier p{color:var(--ink-2);font-size:.94rem;margin:0}
@media (max-width:760px){.tiers{grid-template-columns:1fr}}

/* Dark band */
.band{background:var(--band);color:var(--band-ink)}
.band .muted{color:color-mix(in srgb,var(--band-ink) 72%,transparent)}
.band .btn-ghost{border-color:color-mix(in srgb,var(--band-ink) 35%,transparent);color:var(--band-ink)}
.band .btn-ghost:hover{background:var(--band-2)}
.band-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
@media (max-width:860px){.band-grid{grid-template-columns:1fr}}

/* Steps (true sequences) */
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);counter-reset:s}
.steps li{counter-increment:s;padding:0 24px 0 0;position:relative}
.steps li::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid var(--brass);font-family:var(--serif);font-size:1.2rem;background:var(--bg);position:relative;z-index:1;margin-bottom:18px}
.steps li:not(:last-child)::after{content:"";position:absolute;top:20px;left:40px;right:0;height:2px;background:var(--brass);opacity:.4}
.steps h3{margin-bottom:6px}
.steps p{color:var(--ink-2);font-size:.95rem;max-width:30ch}
.alt .steps li::before{background:var(--surface)}
@media (max-width:820px){.steps{grid-template-columns:1fr;gap:26px}.steps li{padding:0 0 0 58px}.steps li::before{position:absolute;left:0;top:-6px;margin:0}.steps li:not(:last-child)::after{left:19px;top:34px;bottom:-26px;width:2px;height:auto;right:auto}}
.vsteps{list-style:none;padding:0;margin:0;counter-reset:v}
.vsteps li{counter-increment:v;position:relative;padding:0 0 26px 58px}
.vsteps li::before{content:counter(v);position:absolute;left:0;top:-4px;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid var(--brass);font-family:var(--serif);font-size:1.1rem;background:var(--bg)}
.vsteps li:not(:last-child)::after{content:"";position:absolute;left:18px;top:34px;bottom:0;width:2px;background:var(--brass);opacity:.35}
.vsteps p{color:var(--ink-2);margin:4px 0 0;max-width:52ch}
.alt .vsteps li::before,.card .vsteps li::before{background:var(--surface)}

/* Chain */
.chain{display:flex;flex-direction:column;max-width:440px}
.chain .cn{padding:14px 18px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:center;transition:background .35s,border-color .35s,opacity .35s}
.chain .ar{height:20px;width:2px;background:var(--brass);margin-left:30px;opacity:.5}
.chain .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.78rem;font-weight:700;flex:none}
.chain .cn.alert{border-color:var(--bad);background:var(--bad-bg)} .chain .cn.alert .ic{background:var(--bad);color:#fff}
.chain .cn.good{border-color:var(--ok);background:var(--ok-bg)} .chain .cn.good .ic{background:var(--ok);color:#fff}
.chain .cn.pending{opacity:.45}

/* Quotes */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.quote{border-top:2px solid var(--ink);padding-top:18px}
.quote blockquote{margin:0 0 14px;font-family:var(--serif);font-size:1.3rem;line-height:1.35}
@media (max-width:860px){.quotes{grid-template-columns:1fr}}

/* FAQ */
details.faq{border-bottom:1px solid var(--line-2)}
details.faq summary{list-style:none;cursor:pointer;padding:22px 40px 22px 0;font-family:var(--serif);font-size:1.3rem;position:relative}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";position:absolute;right:4px;top:18px;font-family:var(--sans);font-size:1.5rem;color:var(--brass)}
details.faq[open] summary::after{content:"\2013"}
details.faq .ans{padding:0 0 22px;color:var(--ink-2);max-width:64ch}
.faq-group{margin-bottom:48px}
.faq-group>h2{font-size:1.9rem;margin-bottom:8px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}

.form-card{padding:34px}

@media (max-width:640px){.form-card{padding:22px 18px;border-radius:14px}}

/* App layout */
.app-head{background:var(--surface);border-bottom:1px solid var(--line)}

@media (max-width:900px){.ops{grid-template-columns:1fr}.ops-side{position:static;height:auto;padding:10px}.ops-side .who,.ops-side .logo{display:none}.ops-side nav{display:flex;overflow-x:auto;gap:4px}.ops-side nav a{white-space:nowrap}}

/* Modal */

.mini-steps li.done{color:var(--ink)} .mini-steps li.done::before{background:var(--brass);border-color:var(--brass)}

/* Customer dashboard */
.dash{display:grid;grid-template-columns:1.25fr .95fr;gap:22px;align-items:start;padding:30px 0 70px}

@keyframes rotin{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}
.hero2 .lede{color:color-mix(in srgb,var(--band-ink) 78%,transparent);margin:26px 0 32px;max-width:40ch}
.btn-sun{background:var(--sun);color:var(--sun-ink)}

/* DIY vs Handled */
.vs{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}

.ticks li{display:flex;gap:8px;align-items:center}

const api = {
  bookings: () => S.bookings,

}

/* ---- Price estimator (illustrative rates, edit freely) ---- */
const EST = {
  // r = rough miles from central London, a = compass bearing. Used only for a ballpark distance.
  zones: {"Central London":[2,0],"East London":[7,90],"West London":[7,270],"North London":[7,0],"South London":[7,180],"Heathrow":[16,275],"Gatwick":[28,190],"Stansted":[36,35],"Luton":[32,330],"Surrey":[24,215],"Kent":[30,130],"Hertfordshire":[22,340],"Brighton":[52,185]},
  vehicles: [ // [label, max passengers, £ per mile, minimum]
    ["Saloon",3,2.3,45],["Executive MPV",7,3.2,80],["Minibus",16,4.6,170],["Coach",33,6.5,320]],
  roadFactor: 1.3, base: 20
};
function estimate(d){
  const z=EST.zones, A=z[d.from], B=z[d.to]; if(!A||!B) return null;
  const rad=x=>x*Math.PI/180;
  const ax=A[0]*Math.sin(rad(A[1])), ay=A[0]*Math.cos(rad(A[1])), bx=B[0]*Math.sin(rad(B[1])), by=B[0]*Math.cos(rad(B[1]));
  const miles=Math.max(3,Math.hypot(ax-bx,ay-by)*EST.roadFactor);
  const pax=Math.max(1,+d.pax||1); const v=EST.vehicles.find(x=>pax<=x[1])||EST.vehicles[EST.vehicles.length-1];
  let mid=Math.max(v[3],EST.base+miles*v[2]); if(d.ret) mid*=1.9;
  const r5=x=>Math.round(x/5)*5;
  const f=fee(d.ret?"transportReturn":"transportSingle")+(d.today?fee("urgent"):0);
  return {miles:Math.round(miles),vehicle:v[0],low:r5(mid*.85),high:r5(mid*1.2),fee:f};
}

function runDrill(){
  const d=S.drill; d.running=true; d.step=0; d.log=[];

  const tick=()=>{ d.log.push([nowTime(),msgs[d.step]]);
    if(d.step===3) api.postChat({from:"in",time:nowTime(),text:"Quick update on your return journey: our original partner for the 23:00 pickup is no longer available, so we've arranged a replacement Executive MPV with another of our vetted partners. Same time, same pickup point. There's nothing you need to do."});

  ${phone("Customer dashboard","Every booking and service in one place.",head("Sarah M.")+`<div class="pc"><p class="faint" style="margin:0 0 6px">Upcoming</p><div class="mf"><b>Wedding, 14 November</b><br><span class="pill ok" style="margin-top:4px">Confirmed</span></div><div class="mf" style="display:flex;justify-content:space-between"><span>Transport</span><span class="pill ok">Confirmed</span></div><div class="mf" style="display:flex;justify-content:space-between"><span>Flowers</span><span class="pill ok">Confirmed</span></div><div class="mf" style="display:flex;justify-content:space-between"><span>Cake</span><span class="pill ok">Confirmed</span></div><div class="mf" style="display:flex;justify-content:space-between"><span>Return journey</span><span class="pill ok">Confirmed</span></div><span class="mbtn" style="background:#1F4A3E;color:#fff">Message your concierge</span></div>`)}
  </div></section></main>`;
}

/* ---------- 14. ROUTER ---------- */
let lastPath=null, lastQ="", booted=false;
function render(scroll=true){
  const raw=location.hash.slice(1)||"/"; const [path,q]=raw.split("?"); const qs=new URLSearchParams(q||"");
  if(REDIRECTS[path]){ location.replace("#"+REDIRECTS[path]); return; }
  if(path.startsWith("/l/")){ location.replace("#/packages"); return; }
  if(path==="/services"){ const m={events:"wedding",celebrations:"celebration",groups:"group",travel:"arrivals"}; const sv=new URLSearchParams(q||"").get("s"); location.replace("#/packages"+(sv&&m[sv]?"?s="+m[sv]:"")); return; }
  const p=path.split("/").filter(Boolean);
  let html;
  if(p[0]==="ops"){ html = p[1]==="workflow"?pageWorkflow(): p[1]==="suppliers"?pageSuppliers(): p[1]==="supplier"?pageSupplier(p[2]): p[1]==="settings"?pageSettings(): pageOps(); }
  else switch(p[0]){
    case undefined: html=pageHome(); break;
    case "how": html=pageHow(); break;
    case "packages": html=pagePackages(); break;
    case "membership": html=pageMembership(); break;
    case "faq": html=pageFaq(); break;
    case "plan": html=pagePlan(qs); break;
    case "urgent": html=pageUrgent(); break;
    case "account": html=pageAccount(); break;
    case "mobile": html=pageMobile(); break;
    case "about": html=pageAbout(); break;
    case "legal": html=pageLegal(); break;
    default: html=null;
  }
  if(!html){ html=site("", `<section class="page-head"><div class="container"><h1>That page doesn't exist.</h1><p class="lede">Try the homepage, or tell us what you're planning.</p><div class="row mt2"><a class="btn btn-primary" href="#/">Go to the homepage</a><a class="btn btn-ghost" href="#/plan">Plan my package</a></div></div></section>`); }
  applyPalette();
  $("#app").innerHTML=html;
  const changed = path!==lastPath || (q||"")!==lastQ; lastPath=path; lastQ=q||"";
  const label=setMeta(path);
  if(changed && scroll){ window.scrollTo(0,0); closeModal(); if(!p[0]) heroSequence();
    if(booted){ const h=document.querySelector("#main h1")||$("#main"); if(h){ if(!h.hasAttribute("tabindex")) h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } $("#announcer").textContent=label; } }
  booted=true;
  const sec=qs.get("s"); if(sec && changed && scroll){ const el=document.getElementById(sec); if(el) setTimeout(()=>el.scrollIntoView({block:"start"}),30); }
  const cb=$("#chatBody"); if(cb) cb.scrollTop=cb.scrollHeight;
}
window.addEventListener("hashchange",()=>render(true));

/* ---------- 15. EVENTS ---------- */
function stepTop(){ window.scrollTo({top:0}); setTimeout(()=>{ const h=$("#plan-h"); h&&h.focus({preventScroll:true}); },0); }
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id, v=el.dataset.v;
  if(a==="close"){ closeModal(); return; }
  switch(a){
    case "skip": { e.preventDefault(); const m=$("#main"); m&&m.focus(); break; }
    case "menu": { const h=$("#sitehead"); const o=h.classList.toggle("open"); el.setAttribute("aria-expanded",o); break; }
    case "ptype": S.plan.data.type=v; ERR={}; save(); render(false); break;
    case "pchip": { const s=S.plan.data.services||(S.plan.data.services=[]); const i=s.indexOf(v); i<0?s.push(v):s.splice(i,1); save(); el.setAttribute("aria-pressed",i<0); break; }
    case "prefill": S.plan.data={type:"wedding",date:"2026-11-14",pax:"6",pickup:"The Hoxton, Shoreditch (London hotel)",dest:"The Manor House, Surrey (wedding venue)",arrive:"13:45",ret:"23:00",bags:"2",vehicle:"Executive MPV (up to 7)",services:["Return journey","Driver details in advance"],existing:"Hotel booked. Venue booked. Ceremony at 2pm.",access:"",notes:"We'd like a professional vehicle and the driver's details in advance.",name:"Sarah Mitchell",phone:"07700 900123",email:"sarah@example.com"}; S.plan.step=1; save(); render(false); stepTop(); toast("Example filled in. Step through to review."); break;
    case "pnext": { const st=planSteps()[S.plan.step]; if(validatePlan(st)){ S.plan.step++; save(); } render(false); if(!Object.keys(ERR).length) stepTop(); else { const f=document.querySelector('[aria-invalid="true"]'); f&&f.focus(); } break; }
    case "pback": ERR={}; S.plan.step=Math.max(0,S.plan.step-1); save(); render(false); stepTop(); break;
    case "psubmit": if(S.plan.quick && !validatePlan("quick")){ render(false); const f=document.querySelector('[aria-invalid="true"]'); f&&f.focus(); break; } submitPlan(); render(false); stepTop(); toast("Request sent"); break;
    case "pquick": ERR={}; S.plan.quick = v==="1"; S.plan.step=0; save(); render(false); stepTop(); break;
    case "pnew": S.plan={step:0,data:{services:[]},quick:false}; S.planDone=null; save(); render(false); stepTop(); break;
    case "usubmit": if(validateUrgent()){ submitUrgent(); render(false); window.scrollTo(0,0); } else { render(false); const f=document.querySelector('[aria-invalid="true"]'); f&&f.focus(); } break;
    case "unew": S.urgent={data:{},done:null}; save(); render(false); break;
    case "jnext": advanceJourney(); render(false); break;
    case "jreset": S.journey=0; S.chat=clone(SEED_CHAT); api.setStage("WED-001",7); save(); render(false); break;
    case "chat-send": sendChat(); break;
    case "vs": S.filters.vs=v; save(); render(false); startFeat(); setFeat(featI); break;
    case "feat": setFeat(+v,true); break;
    case "cookieok": S.cookieOk=true; save(); const cb=document.querySelector(".cookiebar"); cb&&cb.remove(); break;
    case "esttog": S.est[v]=!S.est[v]; save(); render(false); break;
    case "est2plan": { const d=S.est; S.plan={step:1,data:{type:"travel",pickup:d.from,dest:d.to,pax:d.pax,services:d.ret?["Return journey"]:[]}}; S.planDone=null; save(); location.hash="#/plan"; break; }
    case "pal": S.palette=v; save(); applyPalette(); document.querySelectorAll("[data-act=pal]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v)); toast(PALETTES[v][0]); break;
    case "faqtab": S.filters.faq=+v; save(); render(false); break;
    case "waitlist": el.outerHTML='<span class="small yes">Noted. We will let you know.</span>'; toast("Thanks. We will let you know when we launch in "+v+" (demo)"); break;
    case "tochat": { const c=$("#concierge"); c&&c.scrollIntoView({behavior:"smooth",block:"start"}); setTimeout(()=>{ const i=$("#chatIn"); i&&i.focus({preventScroll:true}); },400); break; }
    case "bfilter": S.filters.bookings=v; save(); render(false); break;
    case "sfilter": S.filters.suppliers=v; save(); render(false); break;
    case "open": openBooking(id); break;
    case "adv": { e.stopPropagation(); const b=api.advance(id); toast(`${id}: ${STAGES[b.stage]}`); render(false); if($("#overlay").innerHTML) openBooking(id); break; }
    case "back": { e.stopPropagation(); const b=api.booking(id); api.setStage(id,Math.max(0,b.stage-1)); render(false); if($("#overlay").innerHTML) openBooking(id); break; }
    case "sendupd": toast("WhatsApp update sent (demo)"); break;
    case "drill": runDrill(); break;
    case "gosup": location.hash="#/ops/supplier/"+id; break;
    case "savenotes": api.updateSupplier(id,{notes:$("#supnotes").value}); toast("Notes saved"); break;
    case "tested": api.updateSupplier(id,{lastTested:TODAY}); toast("Test booking logged for today"); render(false); break;
    case "addsup": openAddSupplier(); break;
    case "savesup": { const n=$("#ns-name").value.trim(); if(!n){ $("#ns-name").focus(); toast("Add a supplier name"); return; }
      const lic=$("#ns-lic").checked, ins=$("#ns-ins").checked, cat=$("#ns-cat").value;
      api.addSupplier({id:"sup-"+Date.now(),name:n,kind:$("#ns-kind").value||cat+" supplier",category:cat,area:$("#ns-area").value||"TBC",licensing:cat==="Transport"?(lic?"yes":"pending"):"n/a",insurance:ins?"yes":"pending",vehicle:cat==="Transport"?"TBC":"n/a",rate:$("#ns-rate").value||"TBC",sameDay:"Unknown",hours:"Unknown",backup:false,tier:"Onboarding",lastTested:"",rating:null,jobs:0,notes:"Added "+fmtDate(TODAY)+".",docs:{"Company and contact details":"Pending","Public liability insurance":ins?"Verified":"Requested"}});
      closeModal(); render(false); toast(n+" added to Onboarding"); break; }
    case "feereset": S.fees=clone(CONFIG.fees); save(); render(false); toast("Default fees restored"); break;
    case "demoreset": try{localStorage.removeItem(KEY);}catch(_){} S=freshState(); render(false); toast("Demo data reset"); break;
  }
});
document.addEventListener("click", e=>{ if(e.target.classList&&e.target.classList.contains("modal-bg")) closeModal(); }, true);
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.bind){ const store=t.dataset.bind==="plan"?S.plan.data:S.urgent.data; store[t.dataset.field]=t.value; if(ERR[t.dataset.field]){ delete ERR[t.dataset.field]; const f=t.closest(".field"); f&&f.classList.remove("err"); const m=f&&f.querySelector(".errmsg"); m&&m.remove(); t.removeAttribute("aria-invalid"); } save(); }
  if(t.dataset.fee){ api.setFee(t.dataset.fee,t.value); const r=document.querySelector(".ops-grid .receipt"); if(r) r.outerHTML=receipt("Preview: multi-service booking","Updates as you change fees.",MULTI); }
});
document.addEventListener("change", e=>{ const t=e.target;
  if(t.dataset.est){ S.est[t.dataset.est]=t.value; save(); const f=document.activeElement&&document.activeElement.id; render(false); if(f){ const el=document.getElementById(f); el&&el.focus(); } return; } if(t.dataset.actChange==="tier"){ api.updateSupplier(t.dataset.id,{tier:t.value}); toast("Tier updated to "+t.value); render(false); } });
document.addEventListener("keydown", e=>{
  const t=e.target;
  if((e.key==="Enter"||e.key===" ") && t.matches && t.matches("tr[data-act]") ){ e.preventDefault(); t.click(); return; }
  if(e.key==="Escape"){ if($("#overlay").innerHTML){ closeModal(); return; } const h=$("#sitehead"); if(h&&h.classList.contains("open")){ h.classList.remove("open"); const b=h.querySelector(".menu-btn"); b.setAttribute("aria-expanded","false"); b.focus(); } }
  if(e.key==="Tab" && $("#overlay").innerHTML){ const f=[...document.querySelectorAll(".modal a[href],.modal button,.modal input,.modal select,.modal textarea,.modal [tabindex]")].filter(x=>!x.disabled); if(!f.length) return; const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } }
  if(e.key==="Enter" && e.target.id==="chatIn"){ e.preventDefault(); sendChat(); }
});
render(true);

</script>
